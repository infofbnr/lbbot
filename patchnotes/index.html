<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LB Bot Patchnotes</title>
  <link rel="icon" href="../picture/lbbot.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans">

  <!-- Logo -->
  <div class="flex justify-center mt-8">
    <img
      src="../picture/lbbot.jpg"
      alt="LB Bot"
      class="w-36 h-36 rounded-full shadow-xl border-4 border-teal-500"
    >
  </div>

  <!-- Header -->
  <header class="bg-gradient-to-r from-purple-600 to-pink-600 p-6 text-center text-4xl font-extrabold text-white drop-shadow-lg">
    LB Bot Patchnotes
  </header>

  <!-- Patchnotes -->
  <main
    id="patchnotesContainer"
    class="max-w-3xl mx-auto mt-10 px-4"
  ></main>

  <!-- Logic -->
  <script type="module">
    import { fetchPatchnotes } from './patchnotes.js';
    import { renderPatchnotes } from './script.js';

    const ADMIN_PASSWORD = 'manoonly';

    function isAdmin() {
      return localStorage.getItem('adminPass') === ADMIN_PASSWORD;
    }

  async function loadPatchnotes() {
    const container = document.getElementById('patchnotesContainer');
    const patchnotes = await fetchPatchnotes();
    const admin = isAdmin();

    const hash = window.location.hash;

    // 🔹 SINGLE PATCH VIEW
    if (hash.startsWith('#patch-')) {
      const id = hash.replace('#patch-', '');
      const note = patchnotes.find(p => p.id === id);

      if (!note) {
        container.innerHTML = `
          <p class="text-center text-red-400 font-semibold">
            Patchnote not found.
          </p>
          <a href="https://lbbot.fun"
            class="mt-6 inline-block bg-purple-600 hover:bg-purple-700
                    px-6 py-3 rounded-full font-bold shadow-lg transition">
            ← Back to LB Bot
          </a>
        `;
        return;
      }

      renderPatchnotes(container, [note], admin);

      // Back button
      const backBtn = document.createElement('a');
      backBtn.href = 'https://lbbot.fun';
      backBtn.className = `
        inline-block mb-6 bg-purple-600 hover:bg-purple-700
        px-6 py-3 rounded-full font-bold shadow-lg transition
      `;
      backBtn.textContent = '← Back to LB Bot';

      container.prepend(backBtn);
      return; // ⛔ STOP HERE — do NOT render all
    }

    // 🔹 FULL PATCHNOTES VIEW
    renderPatchnotes(container, patchnotes, admin);
  }

    window.addEventListener('load', loadPatchnotes);
  </script>

</body>
</html>
